<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>순천시 플라이오버</title>
  <link rel="stylesheet" href="/node_modules/@fontsource/noto-sans-kr/800.css" />
  <link rel="stylesheet" href="/node_modules/@fontsource/noto-sans-kr/900.css" />
  <style>
    html, body { margin: 0; height: 100%; background: #0e1418; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; }
    #stage {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #CFE7F3;
      transform-origin: center center;
      font-family: 'Noto Sans KR', sans-serif;
    }
    #stage canvas { position: absolute; inset: 0; display: block; }

    /* 따뜻한 햇빛이 한 번 쓱 훑는 띠 */
    #sunband {
      position: absolute;
      inset: -40% -60%;
      pointer-events: none;
      opacity: 0;
      mix-blend-mode: soft-light;
      background: linear-gradient(105deg,
        rgba(255, 196, 120, 0) 38%,
        rgba(255, 206, 140, .95) 48%,
        rgba(255, 236, 190, 1) 50%,
        rgba(255, 206, 140, .95) 52%,
        rgba(255, 196, 120, 0) 62%);
    }

    /* 왼쪽 위 제목 알약 */
    #title {
      position: absolute;
      left: 64px;
      top: 56px;
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 18px 40px 18px 26px;
      border-radius: 999px;
      background: rgba(22, 32, 40, .86);
      color: #fff;
      font-weight: 900;
      font-size: 50px;
      line-height: 1;
      letter-spacing: -0.01em;
      box-shadow: 0 10px 30px rgba(20, 40, 60, .18);
      transform-origin: left center;
    }
    #title .plane {
      width: 56px; height: 56px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .14);
      display: grid; place-items: center;
    }
    #title .plane svg { width: 34px; height: 34px; }

    /* 명소 이름표 */
    .tag {
      position: absolute;
      left: 0; top: 0;
      will-change: transform, opacity;
      opacity: 0;
    }
    .tag .pill {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 20px 34px 20px 24px;
      border-radius: 999px;
      background: #fff;
      color: #111;
      font-weight: 900;
      font-size: 44px;
      line-height: 1;
      white-space: nowrap;
      letter-spacing: -0.02em;
      box-shadow: 0 14px 34px rgba(30, 50, 70, .22);
      transform-origin: 50% 100%;
    }
    .tag .dot { width: 24px; height: 24px; border-radius: 50%; flex: none; }
    .tag .tail {
      width: 0; height: 0;
      margin: -1px auto 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-top: 16px solid #fff;
    }
  </style>
</head>
<body>
  <div id="stage">
    <div id="sunband"></div>
    <div id="title">
      <span class="plane">
        <svg viewBox="0 0 24 24" fill="#fff" aria-hidden="true">
          <path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
        </svg>
      </span>
      <span>순천시</span>
    </div>
  </div>

  <script type="importmap">
    { "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }
  </script>
  <script type="module" src="/scene.js"></script>
</body>
</html>
