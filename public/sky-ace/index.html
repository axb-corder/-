<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>창공의 에이스</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;600&family=Press+Start+2P&display=swap">
<style>
/* Layout: one 9:16 play field framed like a cockpit gauge, centered on a deep-sea backdrop; mission-briefing cards overlay the field */
:root{
  --bg:#0a141c; --panel:rgba(8,18,26,.86); --ink:#eef2ec; --muted:#93a6b1;
  --brass:#e9b64a; --signal:#e04a3c; --line:rgba(233,182,74,.38);
  --display:"Black Han Sans","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR",system-ui,sans-serif;
  --pixel:"Press Start 2P",ui-monospace,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;
  display:flex;align-items:center;justify-content:center;box-sizing:border-box;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;
  background-image:radial-gradient(ellipse at 50% 40%,#12283a 0%,var(--bg) 70%)}
#frame{position:relative;border-radius:10px;overflow:hidden;box-shadow:0 0 0 1px var(--line),0 24px 70px rgba(0,0,0,.65);
  touch-action:none;user-select:none;-webkit-user-select:none;background:#0d3550}
canvas{display:block;width:100%;height:100%;touch-action:none}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1em;
  padding:2em 1.6em;text-align:center;background:linear-gradient(rgba(6,14,20,.25),rgba(6,14,20,.85) 70%)}
.eyebrow{font-size:.78em;letter-spacing:.18em;color:var(--brass);text-transform:uppercase}
h1{font-family:var(--display);font-weight:400;font-size:4em;line-height:.95;margin:0;text-wrap:balance;
  color:var(--ink);text-shadow:0 .06em 0 #7a2a20,0 .12em .3em rgba(0,0,0,.6)}
h2{font-family:var(--display);font-weight:400;font-size:2.8em;margin:0;color:var(--signal);text-shadow:0 .08em .3em rgba(0,0,0,.6)}
.sub{font-family:var(--pixel);font-size:.75em;letter-spacing:.3em;color:var(--brass);margin:-.4em 0 .4em}
.brief{list-style:none;margin:0;padding:.9em 1.1em;display:grid;gap:.5em;background:var(--panel);
  border:1px solid var(--line);border-radius:6px;text-align:left;font-size:.9em;width:100%;max-width:19em;box-sizing:border-box}
.brief li{display:flex;gap:.7em;align-items:center}
.brief b{display:inline-block;min-width:3.2em;color:var(--brass);font-weight:600}
.badge{display:inline-grid;place-items:center;width:1.5em;height:1.5em;border-radius:50%;font-weight:600;font-size:.85em;color:#fff}
.bP{background:#d2412f}.bB{background:#2f8f4e}.bM{background:#d9a52b;color:#3a2600}
.cta{font-family:var(--display);font-size:1.7em;padding:.35em 2.2em;border:0;border-radius:4px;cursor:pointer;
  background:var(--signal);color:#fff;box-shadow:0 .18em 0 #7a2a20;letter-spacing:.1em}
.cta:hover{filter:brightness(1.1)}
.cta:focus-visible,.tool:focus-visible,#bombBtn:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
.hi{font-size:.8em;color:var(--muted)}
.hi span,.stat span{font-family:var(--pixel);color:var(--ink);font-size:.95em;margin-left:.4em}
.stat{font-size:1em;color:var(--muted)}
#tools{position:absolute;top:.6em;right:.6em;display:flex;gap:.4em}
.tool{width:2.3em;height:2.3em;border-radius:50%;border:1px solid var(--line);background:rgba(8,18,26,.55);
  color:var(--ink);font-size:.85em;cursor:pointer;display:grid;place-items:center;padding:0}
#bombBtn{position:absolute;right:1em;bottom:1em;width:4.6em;height:4.6em;border-radius:50%;border:2px solid rgba(255,255,255,.35);
  background:radial-gradient(circle at 35% 30%,#5fbf73,#23703a);color:#fff;font-family:var(--display);font-size:.95em;
  cursor:pointer;box-shadow:0 .2em .6em rgba(0,0,0,.45);opacity:.85}
#bombBtn:active{transform:scale(.94)}
@media (prefers-reduced-motion:reduce){.cta,.tool{transition:none}}
</style>

<div id="frame">
  <canvas id="game" aria-label="게임 화면"></canvas>

  <div id="tools">
    <button class="tool" id="muteBtn" aria-label="소리 켜기/끄기">♪</button>
    <button class="tool" id="pauseBtn" aria-label="일시정지">II</button>
  </div>
  <button id="bombBtn" hidden aria-label="폭탄 사용">폭탄</button>

  <div class="overlay" id="titleScr">
    <div class="eyebrow">태평양 전선 · 단좌 전투기 작전</div>
    <h1>창공의<br>에이스</h1>
    <div class="sub">SKY ACE</div>
    <ul class="brief">
      <li><b>이동</b>화면을 드래그 · 방향키 / WASD</li>
      <li><b>사격</b>자동 연사</li>
      <li><b>폭탄</b>X 키 또는 폭탄 버튼</li>
      <li><span class="badge bP">P</span>화력 강화 <span class="badge bB">B</span>폭탄 <span class="badge bM">★</span>훈장</li>
    </ul>
    <button class="cta" id="startBtn">출격</button>
    <div class="hi">최고 기록<span id="hiTitle">0</span></div>
  </div>

  <div class="overlay" id="overScr" hidden>
    <div class="eyebrow">작전 종료</div>
    <h2>격추당함</h2>
    <div class="stat">점수<span id="finalScore">0</span></div>
    <div class="stat">도달 구역<span id="finalStage">1</span></div>
    <div class="hi">최고 기록<span id="hiOver">0</span></div>
    <button class="cta" id="retryBtn">다시 출격</button>
  </div>

  <div class="overlay" id="pauseScr" hidden>
    <h2 style="color:var(--ink)">일시정지</h2>
    <button class="cta" id="resumeBtn">계속</button>
  </div>
</div>

<script>
(()=>{
'use strict';
const W=360,H=640,TAU=Math.PI*2,SCROLL=55,WAVE_TIME=50;
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;

const frame=document.getElementById('frame'),cv=document.getElementById('game'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
let scale=1,base=1;
function fit(){
  const s=Math.min((innerWidth-32)/W,(innerHeight-16)/H);
  scale=Math.max(.3,s);
  const dpr=Math.min(devicePixelRatio||1,2);
  frame.style.width=W*scale+'px';frame.style.height=H*scale+'px';frame.style.fontSize=(14*scale)+'px';
  cv.width=Math.round(W*scale*dpr);cv.height=Math.round(H*scale*dpr);base=scale*dpr;
}
addEventListener('resize',fit);fit();

// ---------- storage ----------
let hi=0;
try{hi=+localStorage.getItem('skyace-hi')||0}catch(e){}
function saveHi(){try{localStorage.setItem('skyace-hi',String(hi))}catch(e){}}

// ---------- audio ----------
let ac=null,muted=false,noiseBuf=null,shotCd=0;
function initAudio(){
  if(ac) return;
  try{ac=new (window.AudioContext||window.webkitAudioContext)();
    noiseBuf=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }catch(e){ac=null}
}
function tone(f,dur,type,vol,slide=0,delay=0){
  if(!ac||muted) return;
  const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.linearRampToValueAtTime(Math.max(20,f+slide),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dur+.02);
}
function noise(dur,vol,from=1600,to=150){
  if(!ac||muted) return;
  const t=ac.currentTime,s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();
  s.buffer=noiseBuf;f.type='lowpass';f.frequency.setValueAtTime(from,t);f.frequency.exponentialRampToValueAtTime(to,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f).connect(g).connect(ac.destination);s.start(t);s.stop(t+dur+.05);
}
const sfx={
  shot(){if(shotCd>0)return;shotCd=.16;tone(900,.035,'square',.012,-400)},
  boom(s=1){noise(.25+s*.3,Math.min(.3,.1+s*.1))},
  item(){[660,880,1320].forEach((f,i)=>tone(f,.09,'square',.04,0,i*.06))},
  bomb(){noise(1.3,.4,2500,80);tone(70,1.1,'sawtooth',.1,-40)},
  warn(){for(let i=0;i<3;i++)tone(440,.35,'sawtooth',.05,260,i*.5)},
  die(){noise(1,.35,1800,60);tone(320,.7,'sawtooth',.06,-260)},
  oneup(){[523,659,784,1046].forEach((f,i)=>tone(f,.12,'triangle',.06,0,i*.08))}
};

// ---------- sprites ----------
function makeSprite(w,h,draw){
  const S=2,c=document.createElement('canvas');c.width=w*S;c.height=h*S;
  const g=c.getContext('2d');g.scale(S,S);g.translate(w/2,h/2);draw(g);
  const mono=col=>{const m=document.createElement('canvas');m.width=c.width;m.height=c.height;const x=m.getContext('2d');
    x.drawImage(c,0,0);x.globalCompositeOperation='source-in';x.fillStyle=col;x.fillRect(0,0,m.width,m.height);return m};
  return {img:c,shadow:mono('#000'),white:mono('#fff'),w,h};
}
function poly(g,pts,mirror=true){
  g.beginPath();g.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++)g.lineTo(pts[i][0],pts[i][1]);
  if(mirror)for(let i=pts.length-1;i>=0;i--)g.lineTo(-pts[i][0],pts[i][1]);
  g.closePath();g.fill();
}
function drawFighter(g,o){
  const hs=o.span/2,hl=o.len/2;
  g.fillStyle=o.wing;
  poly(g,[[0,-.32*hl],[-hs+4,-.12*hl],[-hs,.06*hl],[-hs+2,.28*hl],[0,.24*hl]]);
  g.fillStyle=o.trim;
  g.fillRect(-hs+2,-.08*hl,4,.32*hl);g.fillRect(hs-6,-.08*hl,4,.32*hl);
  g.fillStyle=o.wing;
  poly(g,[[0,.68*hl],[-hs*.4,.8*hl],[-hs*.37,.98*hl],[0,.94*hl]]);
  g.fillStyle=o.body;g.beginPath();g.ellipse(0,0,o.span*.11,hl,0,0,TAU);g.fill();
  g.fillStyle='rgba(255,255,255,.22)';g.fillRect(-1,-hl*.8,1.4,hl*1.5);
  g.fillStyle='rgba(0,0,0,.35)';g.fillRect(-.6,.62*hl,1.2,.38*hl);
  g.fillStyle=o.glass;g.beginPath();g.ellipse(0,-.1*hl,o.span*.06,hl*.28,0,0,TAU);g.fill();
  g.fillStyle='rgba(255,255,255,.55)';g.beginPath();g.ellipse(-.6,-.2*hl,.8,hl*.12,0,0,TAU);g.fill();
  g.fillStyle=o.trim;g.beginPath();g.ellipse(0,-hl+2.2,o.span*.11,2.8,0,0,TAU);g.fill();
  if(o.roundel){g.fillStyle=o.roundel;[-1,1].forEach(s=>{g.beginPath();g.arc(s*hs*.58,.08*hl,2.6,0,TAU);g.fill()})}
}
function drawBomber(g,o){
  const hs=o.span/2,hl=o.len/2;
  g.fillStyle=o.wing;
  poly(g,[[0,-.26*hl],[-hs+5,-.12*hl],[-hs,-.04*hl],[-hs+3,.08*hl],[0,.12*hl]]);
  g.fillStyle=o.wing;poly(g,[[0,.7*hl],[-hs*.36,.78*hl],[-hs*.34,.95*hl],[0,.92*hl]]);
  o.engines.forEach(x=>{[-1,1].forEach(s=>{
    g.fillStyle=o.body;g.beginPath();g.ellipse(s*x,-.2*hl,o.span*.035,hl*.2,0,0,TAU);g.fill();
    g.fillStyle='rgba(0,0,0,.4)';g.beginPath();g.ellipse(s*x,-.38*hl,o.span*.03,1.6,0,0,TAU);g.fill();
    g.fillStyle='rgba(225,225,225,.28)';g.beginPath();g.ellipse(s*x,-.42*hl,o.span*.07,1.4,0,0,TAU);g.fill();
  })});
  g.fillStyle=o.body;g.beginPath();g.ellipse(0,0,o.span*.075,hl,0,0,TAU);g.fill();
  g.fillStyle='rgba(255,255,255,.16)';g.fillRect(-1.5,-hl*.85,2,hl*1.6);
  g.fillStyle=o.glass;g.beginPath();g.ellipse(0,-.78*hl,o.span*.04,hl*.12,0,0,TAU);g.fill();
  g.fillStyle=o.trim;g.fillRect(-hs+4,-.1*hl,10,.16*hl);g.fillRect(hs-14,-.1*hl,10,.16*hl);
  g.fillRect(-o.span*.075,.45*hl,o.span*.15,hl*.08);
}
const SPR={
  player:makeSprite(36,32,g=>drawFighter(g,{span:34,len:30,body:'#d8dde2',wing:'#c4cbd2',trim:'#2f6fd6',glass:'#5bb6e6',roundel:'#e0473b'})),
  fighter:makeSprite(32,30,g=>drawFighter(g,{span:30,len:27,body:'#66734f',wing:'#56633f',trim:'#d8c34a',glass:'#2e3a2a'})),
  red:makeSprite(32,30,g=>drawFighter(g,{span:30,len:27,body:'#c8392e',wing:'#a72c23',trim:'#f4d56b',glass:'#3a1a16'})),
  wing:makeSprite(20,18,g=>drawFighter(g,{span:18,len:16,body:'#d8dde2',wing:'#c4cbd2',trim:'#2f6fd6',glass:'#5bb6e6'})),
  bomber:makeSprite(80,56,g=>drawBomber(g,{span:76,len:52,body:'#4e5a66',wing:'#42505c',trim:'#c9b04a',glass:'#22303a',engines:[13,26]})),
  boss:makeSprite(190,124,g=>drawBomber(g,{span:186,len:118,body:'#3d4650',wing:'#353e48',trim:'#b8332a',glass:'#1c252d',engines:[24,46,68]}))
};
const bulletSpr=(()=>{const c=document.createElement('canvas');c.width=c.height=24;const g=c.getContext('2d');
  const gr=g.createRadialGradient(12,12,0,12,12,12);gr.addColorStop(0,'#fff');gr.addColorStop(.3,'#ffe27a');gr.addColorStop(.55,'rgba(255,120,40,.7)');gr.addColorStop(1,'rgba(255,80,20,0)');
  g.fillStyle=gr;g.fillRect(0,0,24,24);return c})();
function drawSprite(sp,x,y,ang=0,alpha=1,sc=1,which='img'){
  ctx.save();ctx.translate(x,y);if(ang)ctx.rotate(ang);if(alpha!==1)ctx.globalAlpha=alpha;
  ctx.drawImage(sp[which],-sp.w*sc/2,-sp.h*sc/2,sp.w*sc,sp.h*sc);ctx.restore();
}

// ---------- palettes / background ----------
const PALS=[
  {name:'제1구역 · 산호해',sea:['#1d7aa6','#155c86'],wave:'rgba(255,255,255,.17)',shallow:'rgba(130,225,230,.4)',sand:'#ead7a2',land:'#4f8a3c',land2:'#3b6d2c'},
  {name:'제2구역 · 노을 해협',sea:['#3b6690','#5b4877'],wave:'rgba(255,220,190,.17)',shallow:'rgba(240,190,170,.32)',sand:'#e6c08f',land:'#6c7f3b',land2:'#55652c'},
  {name:'제3구역 · 폭풍 전선',sea:['#1f4058','#122636'],wave:'rgba(200,230,255,.13)',shallow:'rgba(120,170,190,.3)',sand:'#bfae86',land:'#3e5b37',land2:'#2d4528'}
];
let pal=PALS[0];
const waves=Array.from({length:90},()=>({x:rand(0,W),y:rand(0,H),l:rand(6,16)}));
let bgOff=0,islands=[],clouds=[],islandT=2,cloudT=1;
function blob(g,pts){const n=pts.length;g.beginPath();let m=[(pts[n-1][0]+pts[0][0])/2,(pts[n-1][1]+pts[0][1])/2];g.moveTo(m[0],m[1]);
  for(let i=0;i<n;i++){const p=pts[i],q=pts[(i+1)%n];g.quadraticCurveTo(p[0],p[1],(p[0]+q[0])/2,(p[1]+q[1])/2)}g.closePath();g.fill()}
function makeIsland(p){
  const r=rand(34,80),sz=Math.ceil(r*2.8),c=document.createElement('canvas');c.width=c.height=sz;const g=c.getContext('2d');g.translate(sz/2,sz/2);
  const n=14,pts=[];for(let i=0;i<n;i++){const a=i/n*TAU,rr=r*rand(.68,1.1);pts.push([Math.cos(a)*rr,Math.sin(a)*rr*rand(.8,1.15)])}
  const sc=k=>pts.map(q=>[q[0]*k,q[1]*k]);
  g.fillStyle=p.shallow;blob(g,sc(1.28));g.fillStyle=p.sand;blob(g,pts);g.fillStyle=p.land;blob(g,sc(.8));g.fillStyle=p.land2;blob(g,sc(.5));
  for(let i=0;i<r*.5;i++){const a=rand(0,TAU),d=rand(0,r*.65);g.fillStyle=Math.random()<.5?'#2c5a24':'#3f7a31';g.beginPath();g.arc(Math.cos(a)*d,Math.sin(a)*d,rand(2,4.5),0,TAU);g.fill()}
  return {img:c,s:sz};
}
const cloudSprs=[0,1,2].map(()=>{const w=200,h=120,c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
  for(let i=0;i<9;i++){const x=rand(50,150),y=rand(40,80),r=rand(22,40),gr=g.createRadialGradient(x,y,0,x,y,r);
    gr.addColorStop(0,'rgba(255,255,255,.9)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,w,h)}return c});
function updateBg(dt){
  bgOff=(bgOff+SCROLL*dt)%H;
  if((islandT-=dt)<=0){islandT=rand(4,9);const sp=makeIsland(pal);islands.push({sp,x:rand(0,W),y:-sp.s/2})}
  for(const i of islands)i.y+=SCROLL*dt;islands=islands.filter(i=>i.y-i.sp.s/2<H);
  if((cloudT-=dt)<=0){cloudT=rand(2.5,5.5);clouds.push({img:cloudSprs[Math.random()*3|0],x:rand(-60,W-140),y:-130,v:rand(80,120),a:rand(.16,.3),s:rand(.9,1.5)})}
  for(const c of clouds)c.y+=c.v*dt;clouds=clouds.filter(c=>c.y<H+20);
}
function drawSea(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,pal.sea[0]);g.addColorStop(1,pal.sea[1]);
  ctx.fillStyle=g;ctx.fillRect(-20,-20,W+40,H+40);
  ctx.strokeStyle=pal.wave;ctx.lineWidth=1.3;ctx.beginPath();
  for(const w of waves){const y=(w.y+bgOff)%H;ctx.moveTo(w.x,y);ctx.quadraticCurveTo(w.x+w.l/2,y-2.5,w.x+w.l,y)}
  ctx.stroke();
  for(const i of islands)ctx.drawImage(i.sp.img,i.x-i.sp.s/2,i.y-i.sp.s/2);
}

// ---------- game state ----------
let state='title',player,pB=[],eB=[],enemies=[],items=[],parts=[],floats=[],groups={},gid=0;
let score=0,lives=2,bombs=3,stageN=1,st=null,shake=0,flash=0,banner=null,medalV=500,nextExtend=60000,overT=0,bombT=0,gtime=0;
const D=()=>1+(stageN-1)*.3, BS=()=>1+(stageN-1)*.08;

function resetPlayer(){player={x:W/2,y:H+30,power:player?player.power:1,inv:2.5,alive:true,fire:0,respawn:0,entering:true,bank:0}}
function startGame(){
  initAudio();if(ac&&ac.state==='suspended')ac.resume();
  score=0;lives=2;bombs=3;medalV=500;nextExtend=60000;pB=[];eB=[];enemies=[];items=[];parts=[];floats=[];groups={};
  player=null;resetPlayer();player.power=1;
  state='play';$('titleScr').hidden=true;$('overScr').hidden=true;$('pauseScr').hidden=true;$('bombBtn').hidden=false;
  startStage(1);
}
function startStage(n){stageN=n;pal=PALS[(n-1)%PALS.length];st={t:0,next:2.2,k:0,phase:'waves',boss:null,wt:0,ct:0};showBanner('STAGE '+n,pal.name,3)}
function showBanner(text,sub,dur,alert=false){banner={text,sub,t:0,dur,alert}}
function addScore(n,x,y,show){
  score+=n;if(show)floats.push({x,y,text:String(n),t:0});
  if(score>=nextExtend){nextExtend+=60000;lives++;sfx.oneup();floats.push({x:player.x,y:player.y-30,text:'1UP',t:0,big:true})}
  if(score>hi){hi=score}
}

// ---------- spawning ----------
function mkEnemy(o){const e=Object.assign({t:0,vx:0,vy:0,hp:1,r:12,score:100,air:true,flashT:0,wait:0,fire:1,rate:99,shoot:null},o);e.maxhp=e.hp;enemies.push(e);return e}
function newGroup(n){gid++;groups[gid]={left:n,fail:false};return gid}
function fireDir(x,y,a,s){if(eB.length<380)eB.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:3.6})}
function fireAt(x,y,s,n=1,spread=0){const a0=Math.atan2(player.y-y,player.x-x);for(let i=0;i<n;i++)fireDir(x,y,a0+(i-(n-1)/2)*spread,s)}
function ring(x,y,s,n,off=0){for(let i=0;i<n;i++)fireDir(x,y,off+i*TAU/n,s)}
const mvStraight=(e,dt)=>{e.x+=e.vx*dt;e.y+=e.vy*dt};
const mvTurn=(e,dt)=>{e.ang+=e.turn*dt;e.vx=Math.cos(e.ang)*e.spd;e.vy=Math.sin(e.ang)*e.spd;mvStraight(e,dt)};
const mvDive=(e,dt)=>{if(e.t<1.1)e.vx=clamp((player.x-e.x)*1.6,-130,130);else e.vx*=Math.pow(.4,dt);mvStraight(e,dt)};
const mvBomber=(e,dt)=>{if(e.t<e.stay){e.y+=(e.ty-e.y)*Math.min(1,1.3*dt);e.x+=Math.sin(e.t*.9)*30*dt;e.vy=0}else{e.vy=45;e.y+=45*dt}};
const mvShip=(e,dt)=>{e.y+=(SCROLL-6)*dt};
const shootAim=s=>e=>fireAt(e.x,e.y+8,s*BS());
const fighterBase=(red,g)=>({kind:'fighter',red,gid:g,hp:Math.ceil(2*D()),r:13,score:red?300:120,rate:2.4,fire:rand(.4,1.6),shoot:shootAim(150)});
const WAVES={
  vee(red){const cx=rand(80,W-80),g=red?newGroup(5):0;
    for(let i=0;i<5;i++){const o=i-2;mkEnemy({...fighterBase(red,g),x:cx+o*26,y:-20-Math.abs(o)*22,vy:125*(1+(stageN-1)*.06),move:mvStraight})}},
  swoop(red){const side=Math.random()<.5?-1:1,deep=Math.random()<.5,a0=deep?1.25:1.0,tr=deep?.72:.92,y0=rand(-10,50),g=red?newGroup(6):0;
    for(let i=0;i<6;i++)mkEnemy({...fighterBase(red,g),x:side<0?-20:W+20,y:y0,wait:i*.2,spd:260,
      ang:side<0?a0:Math.PI-a0,turn:side<0?-tr:tr,move:mvTurn,rate:3,fire:rand(.6,1.4)})},
  diver(){const n=3+(stageN>1);for(let i=0;i<n;i++)mkEnemy({...fighterBase(false,0),x:rand(30,W-30),y:-20,vy:165,wait:i*.45,move:mvDive,fire:rand(.5,1)})},
  side(){const s=Math.random()<.5?-1:1,y=rand(70,190);
    for(let i=0;i<4;i++)mkEnemy({...fighterBase(false,0),x:s<0?-20:W+20,y,vx:-s*150,vy:22,wait:i*.32,move:mvStraight,rate:1.7,fire:rand(.3,.8)})},
  ships(){[W*.28,W*.72].forEach((x,i)=>mkEnemy({kind:'ship',air:false,x:x+rand(-30,30),y:-40-i*50,hp:Math.ceil(18*D()),r:16,score:600,
    move:mvShip,rate:1.9,fire:rand(.8,1.6),shoot:e=>fireAt(e.x,e.y-12,120*BS()),hit:(e,x,y)=>Math.abs(x-e.x)<12&&Math.abs(y-e.y)<34}))},
  bomber(){const n=stageN>=3&&Math.random()<.5?2:1;
    for(let i=0;i<n;i++)mkEnemy({kind:'bomber',x:n===1?rand(90,W-90):(i?W*.72:W*.28),y:-50,ty:rand(100,170),stay:7,hp:Math.ceil(45*D()),r:30,score:1500,
      move:mvBomber,rate:1.5,fire:1.2,k:0,shoot:e=>{e.k++;e.k%2?fireAt(e.x,e.y+20,145*BS(),3,.22):ring(e.x,e.y,105*BS(),10,rand(0,1))},
      hit:(e,x,y)=>{const dx=Math.abs(x-e.x),dy=y-e.y;return (dx<38&&dy>-10&&dy<10)||(dx<7&&Math.abs(dy)<26)}})}
};
function spawnWave(){
  st.k++;const red=st.k%4===0;
  const opts=[['vee',3],['swoop',3],['diver',2],['side',2],['ships',1.4],['bomber',st.k>3?1+stageN*.3:0]];
  let tot=opts.reduce((a,o)=>a+o[1],0),r=Math.random()*tot,type='vee';
  for(const o of opts){if((r-=o[1])<=0){type=o[0];break}}
  if(red&&type!=='vee'&&type!=='swoop')type='swoop';
  WAVES[type](red);
}
function bossTurrets(e){return [{x:e.x-52,y:e.y+4},{x:e.x+52,y:e.y+4},{x:e.x-22,y:e.y+30},{x:e.x+22,y:e.y+30}]}
function spawnBoss(){
  st.boss=mkEnemy({kind:'boss',x:W/2,y:-90,hp:Math.ceil(750*D()),r:70,score:20000,entering:true,a1:1.5,a2:3,a3:0,
    move:moveBoss,hit:(e,x,y)=>{const dx=Math.abs(x-e.x),dy=y-e.y;return (dx<90&&dy>-16&&dy<20)||(dx<15&&Math.abs(dy)<58)}});
}
function moveBoss(e,dt){
  if(e.dying!=null){e.dying-=dt;e.y+=14*dt;if(Math.random()<dt*16)boom(e.x+rand(-85,85),e.y+rand(-45,45),rand(.6,1.3));if(e.dying<=0)finishBoss(e);return}
  if(e.entering){e.y+=42*dt;if(e.y>=125){e.y=125;e.entering=false;e.t=0}return}
  e.x=W/2+Math.sin(e.t*.45)*70;e.y=125+Math.sin(e.t*.9)*12;
  if(!player.alive)return;
  const f=e.hp/e.maxhp,b=BS(),T=bossTurrets(e);e.a1-=dt;e.a2-=dt;e.a3-=dt;
  if(f>.66){if(e.a1<=0){e.a1=1.2;T.slice(0,2).forEach(p=>fireAt(p.x,p.y,150*b,3,.2))}if(e.a2<=0){e.a2=2.8;ring(e.x,e.y+30,105*b,14,e.t)}}
  else if(f>.33){if(e.a1<=0){e.a1=.85;T.forEach(p=>fireAt(p.x,p.y,165*b))}if(e.a2<=0){e.a2=1.7;ring(e.x,e.y+30,115*b,18,e.t*1.3)}}
  else{if(e.a3<=0){e.a3=.11;const a=e.t*2.4;fireDir(e.x,e.y+30,a,120*b);fireDir(e.x,e.y+30,a+Math.PI,120*b)}if(e.a1<=0){e.a1=1.6;fireAt(e.x,e.y+40,170*b,5,.16)}}
}
function finishBoss(e){
  e.dead=true;boom(e.x,e.y,3);boom(e.x-50,e.y,2);boom(e.x+50,e.y,2);flash=1;
  addScore(e.score,e.x,e.y,true);const bonus=5000*stageN;addScore(bonus);
  dropItem('P',e.x-20,e.y);dropItem('B',e.x+20,e.y);for(let i=0;i<6;i++)dropItem('M',e.x+rand(-60,60),e.y+rand(-30,30));
  st.phase='clear';st.ct=0;showBanner('STAGE CLEAR','보너스 +'+bonus,4);
}

// ---------- effects ----------
function boom(x,y,s=1){
  const n=6+s*6|0;
  for(let i=0;i<n;i++){const a=rand(0,TAU),v=rand(10,70)*s;parts.push({k:'puff',x:x+rand(-5,5)*s,y:y+rand(-5,5)*s,vx:Math.cos(a)*v,vy:Math.sin(a)*v+SCROLL*.3,r:rand(4,8)*s,g:rand(14,26)*s,t:0,max:rand(.45,.8)+s*.15})}
  for(let i=0;i<8*s;i++){const a=rand(0,TAU),v=rand(80,230)*s;parts.push({k:'spark',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:0,max:rand(.25,.5)})}
  shake=Math.max(shake,2*s);sfx.boom(s);
}
function dropItem(k,x,y){items.push({k,x,y,vx:k==='M'?0:(Math.random()<.5?-45:45),vy:k==='M'?70:48,t:0})}

function killEnemy(e){
  if(e.kind==='boss'){if(e.dying==null){e.dying=2.4;e.hp=0;
    for(const b of eB)floats.push({x:b.x,y:b.y,text:'',t:.4,dot:true});eB=[];}return}
  e.dead=true;addScore(e.score,e.x,e.y,e.score>=600);
  boom(e.x,e.y,e.kind==='bomber'?1.8:e.kind==='ship'?1.3:.9);
  if(e.kind==='bomber'){dropItem(player.power<4&&Math.random()<.7?'P':'B',e.x,e.y)}
  else if(e.kind==='ship'){if(Math.random()<.6)dropItem('M',e.x,e.y);else if(Math.random()<.3)dropItem('B',e.x,e.y)}
  else if(Math.random()<.04)dropItem('M',e.x,e.y);
  if(e.gid&&groups[e.gid]){const g=groups[e.gid];g.left--;if(g.left===0&&!g.fail){dropItem('P',e.x,e.y);floats.push({x:e.x,y:e.y-14,text:'편대 전멸!',t:0,big:true})}}
}
function hitPlayer(){
  if(!player.alive||player.inv>0)return;
  player.alive=false;boom(player.x,player.y,1.7);sfx.die();shake=10;
  player.power=Math.max(1,player.power-1);eB=[];
  if(lives===0){overT=2}else{lives--;player.respawn=1.3}
}
function useBomb(){
  if(state!=='play'||!player.alive||bombs<=0||bombT>0)return;
  bombs--;bombT=1.3;flash=1;shake=9;player.inv=Math.max(player.inv,2.2);sfx.bomb();
  parts.push({k:'ring',x:player.x,y:player.y,t:0,max:1});
  for(const b of eB)floats.push({x:b.x,y:b.y,text:'',t:.4,dot:true});eB=[];
  for(const e of enemies){if(e.wait>0||e.y<-30)continue;
    if(e.kind==='boss'){if(!e.entering&&e.dying==null){e.hp-=70;e.flashT=.1;if(e.hp<=0)killEnemy(e)}}
    else{e.hp-=40;if(e.hp<=0)killEnemy(e)}}
}

// ---------- input ----------
const keys={};let mdx=0,mdy=0,drag=null;
addEventListener('keydown',e=>{
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code))e.preventDefault();
  keys[e.code]=true;
  if(e.code==='KeyX'||e.code==='KeyB')useBomb();
  if(e.code==='KeyP'||e.code==='Escape')togglePause();
  if((e.code==='Enter'||e.code==='Space')&&(state==='title'||(state==='over'&&!$('overScr').hidden)))startGame();
});
addEventListener('keyup',e=>{keys[e.code]=false});
cv.addEventListener('pointerdown',e=>{if(state!=='play')return;drag={x:e.clientX,y:e.clientY,id:e.pointerId};try{cv.setPointerCapture(e.pointerId)}catch(_){}});
cv.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;mdx+=(e.clientX-drag.x)/scale*1.2;mdy+=(e.clientY-drag.y)/scale*1.2;drag.x=e.clientX;drag.y=e.clientY});
const endDrag=e=>{if(drag&&e.pointerId===drag.id)drag=null};
cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);
$('bombBtn').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();useBomb()});
$('startBtn').onclick=startGame;$('retryBtn').onclick=startGame;$('resumeBtn').onclick=togglePause;
$('pauseBtn').onclick=togglePause;
$('muteBtn').onclick=()=>{muted=!muted;$('muteBtn').style.opacity=muted?.4:1;$('muteBtn').textContent=muted?'×':'♪'};
function togglePause(){
  if(state==='play'){state='paused';$('pauseScr').hidden=false}
  else if(state==='paused'){state='play';$('pauseScr').hidden=true;last=performance.now()}
}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')togglePause()});

// ---------- update ----------
function updatePlayer(dt){
  const p=player;
  if(!p.alive){if(overT>0)return;p.respawn-=dt;if(p.respawn<=0)resetPlayer();return}
  p.inv-=dt;
  let vx=0;
  if(p.entering){p.y-=170*dt;if(p.y<=H-100)p.entering=false;mdx=mdy=0}
  else{
    const k=(keys.ArrowLeft||keys.KeyA?-1:0)+(keys.ArrowRight||keys.KeyD?1:0),kv=(keys.ArrowUp||keys.KeyW?-1:0)+(keys.ArrowDown||keys.KeyS?1:0);
    const sp=230*dt;vx=k*sp+mdx;p.x+=vx;p.y+=kv*sp+mdy;mdx=mdy=0;
    p.x=clamp(p.x,14,W-14);p.y=clamp(p.y,50,H-22);
  }
  p.bank+=(clamp(vx/(dt*240||1),-1,1)-p.bank)*Math.min(1,dt*10);
  if((p.fire-=dt)<=0){p.fire=.09;shoot()}
}
function shoot(){
  const p=player,lv=p.power,add=(ox,a,dmg=1,w=3)=>pB.push({x:p.x+ox,y:p.y-14,vx:Math.sin(a)*640,vy:-Math.cos(a)*640,dmg,w});
  if(lv>=4){add(0,0,1.6,5);add(-7,0);add(7,0)}else{add(-5,0);add(5,0)}
  if(lv>=2){add(-10,-.1);add(10,.1)}
  if(lv>=3){add(-13,-.22,.8);add(13,.22,.8)}
  if(lv>=4){add(-15,-.34,.7);add(15,.34,.7)}
  sfx.shot();
}
function update(dt){
  gtime+=dt;shotCd-=dt;bombT-=dt;
  updateBg(dt);
  if(state!=='play'){updateParts(dt);return}
  updateStage(dt);updatePlayer(dt);
  // player bullets
  for(const b of pB){b.x+=b.vx*dt;b.y+=b.vy*dt}
  pB=pB.filter(b=>b.y>-20&&b.x>-20&&b.x<W+20);
  // enemies
  for(const e of enemies){
    if(e.wait>0){e.wait-=dt;continue}
    e.t+=dt;e.move(e,dt);if(e.flashT>0)e.flashT-=dt;
    if(e.shoot&&player.alive){e.fire-=dt;if(e.fire<=0){e.fire=e.rate*rand(.8,1.25);if(e.y>12&&e.y<H*.72&&Math.abs(e.y-player.y)>70)e.shoot(e)}}
    if(e.kind!=='boss'&&e.t>.6&&(e.y>H+70||e.y<-140||e.x<-90||e.x>W+90)){e.dead=true;e.escaped=true;if(e.gid&&groups[e.gid])groups[e.gid].fail=true}
  }
  // collisions: bullets -> enemies
  for(const b of pB){
    for(const e of enemies){
      if(e.dead||e.wait>0||e.dying!=null)continue;
      const hit=e.hit?e.hit(e,b.x,b.y):((b.x-e.x)**2+(b.y-e.y)**2<e.r*e.r);
      if(hit){b.dead=true;
        if(!e.entering){e.hp-=b.dmg;e.flashT=.05;if(e.hp<=0)killEnemy(e)}
        if(Math.random()<.35)parts.push({k:'spark',x:b.x,y:b.y,vx:rand(-60,60),vy:rand(-120,-30),t:0,max:.2});
        break}
    }
  }
  pB=pB.filter(b=>!b.dead);enemies=enemies.filter(e=>!e.dead);
  // enemy bullets
  for(const b of eB){b.x+=b.vx*dt;b.y+=b.vy*dt}
  eB=eB.filter(b=>b.x>-20&&b.x<W+20&&b.y>-20&&b.y<H+20);
  const p=player;
  if(p.alive&&p.inv<=0&&!p.entering){
    for(const b of eB){if((b.x-p.x)**2+(b.y-p.y)**2<(b.r+2.2)**2){hitPlayer();break}}
    if(p.alive)for(const e of enemies){if(!e.air||e.wait>0||e.dying!=null)continue;
      const hit=e.hit?e.hit(e,p.x,p.y):((e.x-p.x)**2+(e.y-p.y)**2<(e.r*.75+4)**2);if(hit){hitPlayer();if(e.kind==='fighter'||e.kind==='red'){e.hp=0;killEnemy(e)}break}}
  }
  enemies=enemies.filter(e=>!e.dead);
  // items
  for(const it of items){it.t+=dt;it.x+=it.vx*dt;it.y+=it.vy*dt;if(it.x<12||it.x>W-12)it.vx*=-1;it.x=clamp(it.x,12,W-12);
    if(p.alive&&(it.x-p.x)**2+(it.y-p.y)**2<22*22){it.dead=true;collect(it)}
    if(it.y>H+20){it.dead=true;if(it.k==='M')medalV=500}}
  items=items.filter(i=>!i.dead);
  updateParts(dt);
  if(overT>0){overT-=dt;if(overT<=0)gameOver()}
}
function collect(it){
  sfx.item();
  if(it.k==='P'){if(player.power<4){player.power++;floats.push({x:it.x,y:it.y,text:'POWER UP',t:0,big:true})}else addScore(2000,it.x,it.y,true)}
  else if(it.k==='B'){if(bombs<6){bombs++;floats.push({x:it.x,y:it.y,text:'BOMB',t:0,big:true})}else addScore(2000,it.x,it.y,true)}
  else{addScore(medalV,it.x,it.y,true);medalV=Math.min(medalV+100,3000)}
}
function updateParts(dt){
  for(const q of parts){q.t+=dt;if(q.vx!=null){q.x+=q.vx*dt;q.y+=q.vy*dt;if(q.k==='puff'){q.vx*=Math.pow(.2,dt);q.vy=q.vy*Math.pow(.2,dt)+SCROLL*.4*dt}}}
  parts=parts.filter(q=>q.t<q.max);
  for(const f of floats){f.t+=dt;f.y-=(f.dot?0:30)*dt}
  floats=floats.filter(f=>f.t<(f.dot?.6:1.1));
  if(banner){banner.t+=dt;if(banner.t>banner.dur)banner=null}
  shake=Math.max(0,shake-dt*18);flash=Math.max(0,flash-dt*2.2);
}
function updateStage(dt){
  st.t+=dt;
  if(st.phase==='waves'){
    if(st.t>=st.next){spawnWave();st.next=st.t+rand(1.7,2.6)/Math.min(1.6,1+(stageN-1)*.15)}
    if(st.t>WAVE_TIME){st.phase='warn';st.wt=0;showBanner('WARNING','대형 폭격기 접근',3,true);sfx.warn()}
  }else if(st.phase==='warn'){st.wt+=dt;if(st.wt>3.2){spawnBoss();st.phase='boss'}}
  else if(st.phase==='clear'){st.ct+=dt;if(st.ct>4.5)startStage(stageN+1)}
}
function gameOver(){
  state='over';$('bombBtn').hidden=true;saveHi();
  $('finalScore').textContent=score.toLocaleString();$('finalStage').textContent=stageN;$('hiOver').textContent=hi.toLocaleString();
  $('overScr').hidden=false;
}

// ---------- draw ----------
function drawShip(e){
  ctx.save();ctx.translate(e.x,e.y);
  ctx.fillStyle='rgba(255,255,255,.22)';ctx.beginPath();ctx.moveTo(-9,28);ctx.lineTo(9,28);ctx.lineTo(16,80);ctx.lineTo(-16,80);ctx.closePath();ctx.fill();
  const hull=()=>{ctx.beginPath();ctx.moveTo(0,-36);ctx.quadraticCurveTo(12,-18,11,10);ctx.lineTo(8,32);ctx.lineTo(-8,32);ctx.lineTo(-11,10);ctx.quadraticCurveTo(-12,-18,0,-36);ctx.closePath()};
  ctx.fillStyle='#5f6a73';hull();ctx.fill();
  ctx.fillStyle='#86919a';ctx.fillRect(-7,-14,14,40);
  ctx.fillStyle='#4a535b';ctx.fillRect(-5,-2,10,12);ctx.fillStyle='#3a4248';ctx.beginPath();ctx.arc(0,14,3,0,TAU);ctx.fill();
  if(e.flashT>0){ctx.fillStyle='rgba(255,255,255,.6)';hull();ctx.fill()}
  const ty=-14,a=Math.atan2(player.y-(e.y+ty),player.x-e.x);
  ctx.translate(0,ty);ctx.rotate(a);ctx.fillStyle='#2f363c';ctx.fillRect(0,-1.6,11,3.2);ctx.beginPath();ctx.arc(0,0,5,0,TAU);ctx.fill();
  ctx.restore();
}
function rotOf(e){return e.kind==='bomber'||e.kind==='boss'?Math.PI:Math.atan2(e.vy||1,e.vx)+Math.PI/2}
function sprOf(e){return e.kind==='boss'?SPR.boss:e.kind==='bomber'?SPR.bomber:e.red?SPR.red:SPR.fighter}
function drawPlane(sp,x,y,rot,flashT,shadowScale=1){
  drawSprite(sp,x,y,rot);
  if(flashT>0)drawSprite(sp,x,y,rot,.7,1,'white');
}
function draw(){
  ctx.setTransform(base,0,0,base,0,0);
  if(shake>0&&!reduceMotion)ctx.translate(rand(-shake,shake),rand(-shake,shake));
  drawSea();
  // ground
  for(const e of enemies)if(!e.air&&e.wait<=0)drawShip(e);
  // shadows
  ctx.globalAlpha=.22;
  for(const e of enemies)if(e.air&&e.wait<=0){const sp=sprOf(e);drawSprite(sp,e.x+14,e.y+22,rotOf(e),1,.85,'shadow')}
  if(player&&player.alive&&state!=='title')drawSprite(SPR.player,player.x+14,player.y+22,0,1,.85,'shadow');
  ctx.globalAlpha=1;
  // items
  for(const it of items)drawItem(it);
  // air enemies
  for(const e of enemies){if(!e.air||e.wait>0)continue;drawPlane(sprOf(e),e.x,e.y,rotOf(e),e.flashT);
    if(e.kind==='boss')drawBossTurrets(e)}
  // player bullets
  if(pB.length){
    ctx.lineCap='round';
    ctx.strokeStyle='rgba(255,170,60,.55)';ctx.lineWidth=5;ctx.beginPath();
    for(const b of pB){ctx.moveTo(b.x,b.y);ctx.lineTo(b.x-b.vx*.016,b.y-b.vy*.016)}ctx.stroke();
    ctx.strokeStyle='#fff6c2';ctx.lineWidth=2;ctx.beginPath();
    for(const b of pB){ctx.moveTo(b.x,b.y);ctx.lineTo(b.x-b.vx*.016,b.y-b.vy*.016)}ctx.stroke();
  }
  // player
  if(state==='title'){const y=H-120+Math.sin(gtime*2)*6;drawSprite(SPR.player,W/2,y);drawProp(W/2,y)}
  else if(player&&player.alive){
    const blink=player.inv>0&&((gtime*16|0)%2===0);
    ctx.save();ctx.translate(player.x,player.y);ctx.scale(1-Math.abs(player.bank)*.18,1);
    drawSprite(SPR.player,0,0,0,blink?.35:1);drawProp(0,0);ctx.restore();
  }
  // enemy bullets
  for(const b of eB)ctx.drawImage(bulletSpr,b.x-8,b.y-8,16,16);
  // particles
  for(const q of parts){const f=q.t/q.max;
    if(q.k==='puff'){ctx.fillStyle=`hsla(${45-f*40},${90-f*65}%,${88-f*68}%,${(1-f)*.9})`;ctx.beginPath();ctx.arc(q.x,q.y,q.r+q.g*f,0,TAU);ctx.fill()}
    else if(q.k==='spark'){ctx.strokeStyle=`rgba(255,215,120,${1-f})`;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(q.x,q.y);ctx.lineTo(q.x-q.vx*.03,q.y-q.vy*.03);ctx.stroke()}
    else if(q.k==='ring'){ctx.strokeStyle=`rgba(255,180,70,${(1-f)*.85})`;ctx.lineWidth=34*(1-f)+2;ctx.beginPath();ctx.arc(q.x,q.y,20+f*480,0,TAU);ctx.stroke()}
  }
  for(const f of floats){
    if(f.dot){ctx.fillStyle=`rgba(255,235,150,${1-f.t/.6})`;ctx.fillRect(f.x-1.5,f.y-1.5-f.t*30,3,3);continue}
    ctx.globalAlpha=1-f.t/1.1;ctx.fillStyle=f.big?'#ffe27a':'#fff';ctx.font=(f.big?'14px ':'8px ')+(f.big?'"Black Han Sans",sans-serif':'"Press Start 2P",monospace');
    ctx.textAlign='center';ctx.fillText(f.text,f.x,f.y);ctx.globalAlpha=1}
  // clouds
  for(const c of clouds){ctx.globalAlpha=c.a;ctx.drawImage(c.img,c.x,c.y,200*c.s,120*c.s)}ctx.globalAlpha=1;
  if(flash>0){ctx.fillStyle=`rgba(255,240,210,${flash*.6})`;ctx.fillRect(-20,-20,W+40,H+40)}
  ctx.setTransform(base,0,0,base,0,0);
  if(state!=='title')drawHUD();
}
function drawProp(x,y){ctx.fillStyle=`rgba(240,240,240,${.35+Math.random()*.25})`;ctx.beginPath();ctx.ellipse(x,y-16.5,8,1.3,0,0,TAU);ctx.fill()}
function drawBossTurrets(e){
  for(const t of bossTurrets(e)){const a=Math.atan2(player.y-t.y,player.x-t.x);
    ctx.save();ctx.translate(t.x,t.y);ctx.rotate(a);ctx.fillStyle='#1f262c';ctx.fillRect(0,-1.8,12,3.6);
    ctx.fillStyle='#596570';ctx.beginPath();ctx.arc(0,0,6,0,TAU);ctx.fill();ctx.fillStyle='#b8332a';ctx.beginPath();ctx.arc(0,0,2.4,0,TAU);ctx.fill();ctx.restore()}
}
function drawItem(it){
  const c={P:['#d2412f','P'],B:['#2f8f4e','B'],M:['#d9a52b','★']}[it.k],pulse=1+Math.sin(it.t*8)*.08;
  ctx.save();ctx.translate(it.x,it.y);ctx.scale(pulse,pulse);
  ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.arc(2,3,10,0,TAU);ctx.fill();
  ctx.fillStyle=c[0];ctx.beginPath();ctx.arc(0,0,10,0,TAU);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=1.5;ctx.stroke();
  ctx.fillStyle=it.k==='M'?'#3a2600':'#fff';ctx.font=it.k==='M'?'13px sans-serif':'10px "Press Start 2P",monospace';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(c[1],it.k==='M'?0:.5,1);ctx.restore();ctx.textBaseline='alphabetic';
}
function drawHUD(){
  ctx.textAlign='left';ctx.fillStyle='#e9b64a';ctx.font='7px "Press Start 2P",monospace';ctx.fillText('SCORE',10,16);
  ctx.fillStyle='#fff';ctx.font='11px "Press Start 2P",monospace';ctx.fillText(String(score).padStart(7,'0'),10,31);
  ctx.textAlign='center';ctx.fillStyle='#e9b64a';ctx.font='7px "Press Start 2P",monospace';ctx.fillText('HI',W/2+10,16);
  ctx.fillStyle='#fff';ctx.font='9px "Press Start 2P",monospace';ctx.fillText(String(Math.max(hi,score)).padStart(7,'0'),W/2+10,30);
  // lives & bombs
  for(let i=0;i<Math.min(lives,6);i++)drawSprite(SPR.player,18+i*18,H-18,0,1,.45);
  for(let i=0;i<bombs;i++){const x=16+i*14,y=H-38;ctx.fillStyle='#2f8f4e';ctx.beginPath();ctx.ellipse(x,y,4,6,0,0,TAU);ctx.fill();ctx.fillStyle='#cde9d2';ctx.fillRect(x-3,y-8,6,2)}
  // power
  ctx.textAlign='left';ctx.fillStyle='#e9b64a';ctx.font='6px "Press Start 2P",monospace';ctx.fillText('PWR',10,H-52);
  for(let i=0;i<4;i++){ctx.fillStyle=i<(player?player.power:1)?'#ff6a4a':'rgba(255,255,255,.2)';ctx.fillRect(34+i*9,H-58,7,6)}
  // boss bar
  const b=st&&st.boss;if(b&&!b.dead&&st.phase==='boss'){const f=Math.max(0,b.hp/b.maxhp);
    ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(40,44,W-80,7);ctx.fillStyle=f>.33?'#e9b64a':'#e04a3c';ctx.fillRect(41,45,(W-82)*f,5);
    ctx.fillStyle='#fff';ctx.font='6px "Press Start 2P",monospace';ctx.textAlign='left';ctx.fillText('BOSS',40,40)}
  // banner
  if(banner){const t=banner.t,d=banner.dur,a=Math.min(1,t*3,(d-t)*3);
    if(!(banner.alert&&(t*4|0)%2)){ctx.globalAlpha=a;ctx.textAlign='center';
      ctx.fillStyle='rgba(6,14,20,.55)';ctx.fillRect(0,H*.38-30,W,64);
      ctx.fillStyle=banner.alert?'#ff5a46':'#fff';ctx.font='30px "Black Han Sans",sans-serif';ctx.fillText(banner.text,W/2,H*.38+4);
      ctx.fillStyle='#e9b64a';ctx.font='14px "Black Han Sans",sans-serif';ctx.fillText(banner.sub,W/2,H*.38+26);ctx.globalAlpha=1}}
}

// ---------- loop ----------
let last=performance.now();
islands.push({sp:makeIsland(pal),x:90,y:180},{sp:makeIsland(pal),x:290,y:470});
clouds.push({img:cloudSprs[0],x:120,y:60,v:90,a:.25,s:1.3});
$('hiTitle').textContent=hi.toLocaleString();
function frameLoop(now){
  const dt=Math.min(.033,(now-last)/1000);last=now;
  if(state!=='paused'){update(dt)}
  draw();requestAnimationFrame(frameLoop);
}
requestAnimationFrame(frameLoop);
})();
</script>
